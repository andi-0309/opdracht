name: Website shell
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: python apps/shell/bootstrap.py
      - name: Align app version with release tag
        shell: python
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          import os, re
          from pathlib import Path
          path = Path('apps/shell/build/native/pubspec.yaml')
          text = path.read_text()
          version = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)$', text, re.M)
          assert version, 'Missing app version'
          if os.environ['RELEASE_REF_TYPE'] == 'tag':
              assert os.environ['RELEASE_REF'] == 'v' + version[1], 'Tag and app version must match'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('APP_VERSION=' + version[1] + '\n')
      - run: flutter pub get
        working-directory: apps/shell/build/native
      - name: Preserve resolved Flutter dependency lock
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: shell-dependency-lock
          path: apps/shell/build/native/pubspec.lock
          if-no-files-found: error
      - run: flutter analyze
        working-directory: apps/shell/build/native
      - run: flutter test
        working-directory: apps/shell/build/native
      - name: Restore private Android signing key
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.OPDRACHT_ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.OPDRACHT_ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE" && test -n "$KEY_PASSWORD" || { echo 'Android signing secrets are required.' >&2; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/opdracht.jks"
          chmod 600 "$RUNNER_TEMP/opdracht.jks"
      - name: Build Android APK
        if: matrix.platform == 'android'
        working-directory: apps/shell/build/native
        env:
          OPDRACHT_KEYSTORE_PATH: ${{ runner.temp }}/opdracht.jks
          OPDRACHT_KEYSTORE_PASSWORD: ${{ secrets.OPDRACHT_ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --dart-define=APP_VERSION=${{ env.APP_VERSION }}
      - name: Verify Android launcher identity
        if: matrix.platform == 'android'
        shell: bash
        run: |
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$aapt" dump badging apps/shell/build/native/build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/opdracht-badging.txt"
          grep -E "application: label='Opdracht' icon='res/.*xml'" "$RUNNER_TEMP/opdracht-badging.txt"
      - name: Build Windows
        if: matrix.platform == 'windows'
        working-directory: apps/shell/build/native
        run: flutter build windows --release --dart-define=APP_VERSION=${{ env.APP_VERSION }}
      - name: Build Apple Silicon macOS app
        if: matrix.platform == 'macos'
        working-directory: apps/shell/build/native
        run: flutter build macos --release --dart-define=APP_VERSION=${{ env.APP_VERSION }}
      - name: Package Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p dist
          cp apps/shell/build/native/build/app/outputs/flutter-apk/app-release.apk dist/Opdracht-Android.apk
      - name: Package and verify Windows installer and portable app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./apps/shell/windows/package.ps1
      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          lipo apps/shell/build/native/build/macos/Build/Products/Release/opdracht.app/Contents/MacOS/opdracht -verify_arch arm64
          test "$(lipo -archs apps/shell/build/native/build/macos/Build/Products/Release/opdracht.app/Contents/MacOS/opdracht)" = arm64
          ditto -c -k --sequesterRsrc --keepParent apps/shell/build/native/build/macos/Build/Products/Release/opdracht.app dist/Opdracht-macOS-arm64.zip
          staging="$(mktemp -d)"
          ditto apps/shell/build/native/build/macos/Build/Products/Release/opdracht.app "$staging/Opdracht.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Opdracht -srcfolder "$staging" -format UDZO dist/Opdracht-macOS-arm64.dmg
          hdiutil verify dist/Opdracht-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Opdracht-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - name: Clean private signing material
        if: always() && matrix.platform == 'android'
        shell: bash
        run: rm -f "$RUNNER_TEMP/opdracht.jks"
  release-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach compiled shells to tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Opdracht release."
          gh release upload "$RELEASE_TAG" dist/Opdracht-* --clobber
